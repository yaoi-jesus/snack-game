function players(){$('app').innerHTML='<h1>Players & playlists</h1><p class="muted">Age 6+ uses simpler questions. Family uses harder questions. Changes to players start a fresh game.</p><div class="box" id="playerlist"></div>';state.players.forEach((p,i)=>{let d=document.createElement('div');d.className='playeredit';d.innerHTML=`<div><label for="pn${i}">Player ${i+1}</label><input id="pn${i}" maxlength="100" value="${esc(p.name)}"></div><div><label for="pl${i}">Difficulty</label><select id="pl${i}"><option value="easy">Age 6+</option><option value="standard">Family</option></select></div><div class="playlist"><label for="pu${i}">YouTube playlist link</label><input id="pu${i}" type="url" value="${esc(p.playlist)}" placeholder="https://www.youtube.com/playlist?list=…" maxlength="2000"></div>`;$('playerlist').append(d);$('pl'+i).value=p.level;['n','l','u'].forEach(k=>$('p'+k+i).onchange=e=>{let key={n:'name',l:'level',u:'playlist'}[k];if(key==='playlist'&&e.target.value&&!playlistURL(e.target.value)){say('Use a YouTube playlist link containing list=…');e.target.value=p.playlist;return;}p[key]=e.target.value;state.game=null;save();});let b=button('Remove',()=>{if(state.game&&!confirm('Changing the players will reset this game. Continue?'))return;state.players.splice(i,1);state.game=null;save();render();});b.disabled=state.players.length<=1;d.append(b);});let b=button('+ Add player',()=>{if(state.game&&!confirm('Adding a player will reset this game. Continue?'))return;state.players.push({name:'Player '+(state.players.length+1),level:'standard',playlist:''});state.game=null;save();render();},'primary');b.disabled=state.players.length>=8;$('app').append(b);}
function topicSetup(){$('app').innerHTML=`<h1>Topics & questions</h1><p class="muted">Each d20 number belongs to a topic. Questions won’t repeat until you’ve tried them all.</p><div class="box"><h2>Number assignments</h2><div class="grid" id="assign"></div></div><div class="box"><h2>Add your own topic</h2><p class="muted">Got another idea? Add a topic, give it some dice numbers, then add its questions below.</p><div class="row"><div style="flex:1;min-width:180px"><label for="newtopic">Topic name</label><input id="newtopic" maxlength="80" placeholder="Animals, spelling, riddles…"></div><div><label for="topicemoji">Emoji</label><input id="topicemoji" maxlength="32" value="❓" style="width:80px"></div></div><p id="addtopic"></p><div id="customtopiclist"></div></div><div class="box"><h2>Add your own challenge</h2><div class="row"><select id="qt" aria-label="Topic" style="width:auto">${topics.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join('')}</select><select id="ql" aria-label="Difficulty" style="width:auto"><option value="easy">Age 6+</option><option value="standard">Family</option></select></div><label for="qq">Question / acting prompt</label><textarea id="qq" maxlength="1000" rows="2"></textarea><label for="qa">Answer / accepted guess</label><input id="qa" maxlength="1000"><p id="addq"></p></div><div class="box"><h2>Question library</h2><div class="row"><select id="filtert" aria-label="Filter topic" style="width:auto">${topics.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join('')}</select><select id="filterl" aria-label="Filter difficulty" style="width:auto"><option value="easy">Age 6+</option><option value="standard">Family</option></select></div><div id="library" class="scroll"></div></div>`;$('addtopic').append(button('Add topic',()=>{let name=$('newtopic').value.trim(),emoji=$('topicemoji').value.trim()||'❓';if(!name){say('Give your topic a name first.');return;}if(topics.some(t=>t.toLowerCase()===name.toLowerCase())){say('That topic already exists.');return;}if((state.customTopics||[]).length>=45){say('You can have up to 50 topics.');return;}(state.customTopics??=[]).push({name,emoji});save();render();say('Topic added. Choose its dice numbers and add questions for the difficulties you use.');},'primary'));$('customtopiclist').replaceChildren();(state.customTopics||[]).forEach((t,i)=>{let chip=document.createElement('span');chip.className='chip';chip.style.cssText='display:inline-flex;align-items:center;gap:8px;margin:4px';let name=document.createElement('span');name.textContent=t.emoji+' '+t.name;let remove=button('×',()=>deleteTopic(i));remove.setAttribute('aria-label','Delete topic '+t.name);remove.title='Delete topic';remove.style.cssText='padding:0 4px;border:0;background:transparent;font-size:20px;line-height:1';chip.append(name,remove);$('customtopiclist').append(chip);});state.assign.forEach((v,i)=>{let d=document.createElement('div');d.innerHTML=`<label for="as${i}">Roll ${i+1}</label><select id="as${i}">${topics.map((t,j)=>`<option value="${j}">${icons[j]} ${esc(t)}</option>`).join('')}</select>`;$('assign').append(d);$('as'+i).value=v;$('as'+i).onchange=e=>{state.assign[i]=Number(e.target.value);save();};});$('addq').append(button('Add challenge',()=>{let q=$('qq').value.trim(),a=$('qa').value.trim(),t=Number($('qt').value);if(t===3){say('Guess the Song uses player playlists. Choose another topic for a written question.');return;}if(!q||!a){say('Enter both a question and an answer.');return;}state.custom.push({id:'c'+crypto.randomUUID(),topic:t,level:$('ql').value,q,a});save();$('qq').value='';$('qa').value='';say('Challenge added.');listQuestions();},'primary'));$('filtert').onchange=listQuestions;$('filterl').onchange=listQuestions;listQuestions();}
function deleteTopic(i){let t=state.customTopics?.[i];if(!t)return;const index=i+5;const count=state.custom.filter(q=>q.topic===index).length;const assigned=state.assign.filter(n=>n===index).length;let message='Delete "'+t.name+'"?';if(count)message+=' This will also delete '+count+' question'+(count===1?'':'s')+'.';if(assigned)message+=' Its '+assigned+' dice number'+(assigned===1?'':'s')+' will go back to General Knowledge.';if(state.game?.question?.topic===index)message+=' The current challenge will be cancelled.';if(!confirm(message))return;stopTimer();undo=null;state.customTopics.splice(i,1);state.assign=state.assign.map(n=>n===index?0:n>index?n-1:n);const removed=new Set(state.custom.filter(q=>q.topic===index).map(q=>q.id));state.custom=state.custom.filter(q=>q.topic!==index).map(q=>({...q,topic:q.topic>index?q.topic-1:q.topic}));let g=state.game;if(g){g.used=g.used.filter(id=>!removed.has(id));if(g.question?.topic===index){g.question=null;if(g.phase==='question')g.phase='topic';}else if(g.question?.topic>index)g.question.topic--;}
showAnswer=false;embed=false;syncTopics();save();render();say('Topic deleted.');}
function listQuestions(){let t=Number($('filtert').value),l=$('filterl').value,qs=[...bank,...state.custom].filter(q=>q.topic===t&&q.level===l);$('library').replaceChildren();if(t===3){$('library').textContent='Songs come from each player’s YouTube playlist. Set their playlist in Players.';return;}qs.forEach(q=>{let d=document.createElement('details');d.className='questionentry';d.innerHTML=`<summary>${esc(q.q)} ${q.id.startsWith('c')?'· Custom':''}</summary><p class="muted">${esc(q.a)}</p>`;if(q.id.startsWith('c'))d.append(button('Delete',()=>{state.custom=state.custom.filter(x=>x.id!==q.id);save();listQuestions();}));$('library').append(d);});}
function prizes(){$('app').innerHTML='<div class="row between"><div><h1>Prize bowls</h1><p class="muted" id="count"></p></div><div id="refill"></div></div><div id="bowls" class="grid"></div>';$('refill').append(button('Refill all bowls',()=>{if(confirm('Refill all bowls? Names and emojis will stay.')){undo=structuredClone(state);state.snacks.forEach(s=>s.empty=false);save();render();}}));function counts(){$('count').textContent=state.snacks.filter(s=>s.name.trim()&&!s.empty).length+' ready · '+state.snacks.filter(s=>s.empty).length+' empty · 20 numbers';}state.snacks.forEach((s,i)=>{let c=document.createElement('div');c.className='box card'+(s.empty?' empty':'');c.innerHTML=`<div class="row between"><strong style="color:var(--blue)">${String(i+1).padStart(2,'0')}</strong><small>${s.empty?'Empty':s.name.trim()?'Available':'Unassigned'}</small></div><label for="emoji${i}">Emoji</label><input class="emoji" id="emoji${i}" maxlength="32" value="${esc(s.emoji)}"><label for="sn${i}">Prize name</label><input class="name" id="sn${i}" maxlength="200" value="${esc(s.name)}" placeholder="Add a snack…">`;$('bowls').append(c);$('emoji'+i).onchange=e=>{s.emoji=e.target.value.trim()||'🍬';save();};$('sn'+i).oninput=e=>{s.name=e.target.value;save();counts();};c.append(button(s.empty?'↶ Refill bowl':'Mark empty',()=>{if(!s.empty&&!s.name.trim()){say('Add a prize name first.');return;}undo=structuredClone(state);s.empty=!s.empty;save();render();}));});counts();}
function setup(){$('app').innerHTML='<h1>Setup & backups</h1><div class="box"><h2>Your game, your browser</h2><p class="muted">Players, playlists, custom questions, prizes, and the current game save automatically on this device. A different browser has its own game. YouTube needs an internet connection.</p><div id="backups" class="row"></div></div><div class="box"><h2>Bring in your original snack board</h2><p class="muted">The Import button also accepts your original Snack Quest prize backup. It replaces only the prize bowls and keeps your player setup.</p></div>';$('backups').append(button('↓ Export backup',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='snack-quest-family-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('Backup downloaded.');},'primary'),button('↑ Import backup',()=>$('file').click()),button('Reset current game',()=>{if(confirm('Clear scores and current game? Your setup and prizes will stay.')){state.game=null;save();render();}}));}
$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error();let d=JSON.parse(await f.text());if(valid(d)){if(confirm('Replace your players, questions, prizes and game with this backup?')){state=d;syncTopics();undo=null;stopTimer();save();render();say('Full game backup restored.');}}else if([1,2].includes(d.version)&&Array.isArray(d.snacks)){let s=defaults();s.snacks=d.snacks.map((x,i)=>({name:x.name,emoji:x.emoji||snackIcons[i%12],empty:d.version===1?false:x.empty}));if(!valid(s))throw Error();if(confirm('Replace only your prize board with this original backup?')){state.snacks=s.snacks;save();render();say('Original prize board restored.');}}else throw Error();}catch{say('That backup is not valid. Choose a Snack Quest JSON export.');}finally{$('file').value='';}};
render();
</script></body></html>
